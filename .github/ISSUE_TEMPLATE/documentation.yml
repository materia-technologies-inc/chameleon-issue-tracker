name: Documentation
description: A page that is missing, wrong, unclear, or out of date.
labels: ["documentation"]
body:
  - type: dropdown
    id: problem-type
    attributes:
      label: What's wrong
      options:
        - Missing
        - Wrong
        - Unclear
        - Out of date
        - Needs an example
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Page
      description: The address of the page on chameleonui.io, or where you expected to find the information.
      placeholder: https://chameleonui.io/...
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What it says, and what it should say
    validations:
      required: true
