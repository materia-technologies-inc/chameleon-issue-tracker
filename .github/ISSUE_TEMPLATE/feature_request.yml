name: Feature request
description: A new component, or a new option on an existing one.
labels: ["enhancement"]
body:
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      description: Choose every framework you need this in.
      multiple: true
      options:
        - Web/JS
        - React
        - Blazor
        - Angular
        - Vue
        - Svelte
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component
      description: Leave this empty if you're asking for a new component.
      placeholder: For example, cw-button or CrSlider
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem you want to solve. This matters more to us than any one solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you picture it working, with a link to the Material 3 guidance if there is one.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried
      description: Workarounds you use today, or other libraries that do this well.
    validations:
      required: false
