name: Bug report
description: A component behaves differently from its documentation.
labels: ["bug"]
body:
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      description: Choose every framework where you see the problem.
      multiple: true
      options:
        - Web/JS
        - React
        - Blazor
        - Angular
        - Vue
        - Svelte
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Chameleon UI version
      placeholder: For example, 27.1
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component
      placeholder: For example, cw-button or CrSlider
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: For example, Chrome 142 on Windows 11
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A link to a StackBlitz, a CodePen, or a small repository, or the smallest code that shows the problem. A report with a reproduction gets fixed first.
      render: html
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else
      description: Screenshots, console errors, or whether it worked in an earlier version.
    validations:
      required: false
