name: Question
description: Something the documentation doesn't answer.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        The [documentation](https://chameleonui.io) and the [Chameleon UI MCP server](https://chameleonui.io/get-started/ai-agents#the-mcp-server) answer most questions straight away. If they don't answer yours, ask here.

  - type: dropdown
    id: framework
    attributes:
      label: Framework
      multiple: true
      options:
        - Web/JS
        - React
        - Blazor
        - Angular
        - Vue
        - Svelte
    validations:
      required: false

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you're trying to do, and what you've already tried.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code
      description: Any code, configuration, or error messages that help.
      render: html
    validations:
      required: false
